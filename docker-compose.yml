version: "3.9"

# ── Local production-equivalent environment ───────────────────────────────────
#
# Usage:
#   make up           # build + start everything
#   make down         # stop + remove containers
#   make logs         # tail all logs
#   make shell-api    # shell into the API container
#
# Required: copy backend/.env.example → backend/.env and set ANTHROPIC_API_KEY

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: simpleseed
      POSTGRES_USER: simpleseed
      POSTGRES_PASSWORD: simpleseed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpleseed -d simpleseed"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://simpleseed:simpleseed@db:5432/simpleseed
    ports:
      - "8000:8000"
    volumes:
      - ./backend/knowledge:/app/knowledge
      - ./backend/files:/app/files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000

volumes:
  postgres_data:
